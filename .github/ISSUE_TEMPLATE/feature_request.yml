name: Feature request
description: Something Landrace should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A new tracker, forge, docs site or coding agent is a new integration: see "Adding an integration" in [CONTRIBUTING.md](https://github.com/yiftahb/landrace/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where Landrace gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: What Landrace should do instead. A workflow snippet, a command or what the board would show helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, or how you work around it today.
