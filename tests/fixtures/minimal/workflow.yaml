version: 1
name: minimal
stages:
  - id: spec
    entry: true
    step: steps/spec.md
    triggers:
      - name: fresh
        when: { "run.stage": null }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Writing the spec, round {round}." }
  - id: done
    terminal: true
    triggers:
      - name: spec written
        when: { "outputs.spec": { $exists: true } }
