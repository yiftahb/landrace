version: 1
name: landrace

# Integrations are imported by path, not named by id. Every path is relative to
# this directory and must stay inside it, and the order is the order pre hooks
# run in. One module can export several kinds — hooks/github.ts exports five —
# so the list is flat: the define* helpers brand each export with its kind, and
# the loader files it from there.
#
# Replacing GitHub is a different file here. Nothing in the engine changes,
# because the engine has no GitHub in it to change.
hooks:
  - hooks/github.ts

eligible:
  - when: { "node.state.labels": { $in: ["lr:auto"] } }
    else: "no lr:auto label"

# One key, because one key is read. The spec and review caps are the `$lt`
# comparisons in the triggers below, where the validator can see them (§11.4)
# and where editing one actually changes what happens — `spec: 3` here was a
# number an operator could edit to no effect at all.
budget:
  # The default for a step that names no `timeout` of its own — triage, the
  # one quick classifier. Every step that does real work says 120m.
  stepTimeout: 10m

# Two rules govern every on_enter list below, and both are load-bearing.
#
# 1. `tracker.status` names the stage's own id, because on GitHub the status
#    *is* the position: the hook writes it as `lr:stage:<value>` and the engine
#    reads run.stage back out of that label. A display name there ("Building")
#    derives a position no stage's identity matches, and the ticket cannot be
#    placed at all.
#
# 2. The `enter` record comes first, before the status that moves the position.
#    It is what tells the engine the stage owes another round — a crash between
#    the two effects must leave the ticket at the *previous* stage, whose
#    trigger simply fires again and replans the identical entry record (the
#    round is derived, so it does not move). Written after the status instead,
#    a crash would land the ticket on a stage that still reads as complete from
#    its last round, and that round would be silently skipped.
#
# And one rule for triggers: every trigger leaving a stage that runs a step
# reads `"run.lastOutputValid": null` — that stage's latest round did not
# fail. A failed round is the halts' to route, and only theirs. Without it a
# failure matched both a halt and the way on: a refused review round also
# read "no threads are open", a failed fix round also read "the fixer
# finished a round", a failed second spec also read the first one's
# `kind: questions` — two triggers, an ambiguity halt, and the ticket left
# wearing lr:working at a stage nothing would ever run again.
# Pull requests are graph nodes: rel.implements.in.* counts every PR tied to the ticket — "all merged" is total > 0 and not.merged: 0, never a single PR's flag.
stages:
  # ── spec phase ───────────────────────────────────────────────────────────
  - id: spec
    step: steps/spec.md
    entry: true
    triggers:
      - name: fresh ticket
        when: { "run.stage": null }
      # run.lastEvent.actor, not lastEvent.actor: the spec lists lastEvent.* as
      # a conventional top-level path, but deriveRun puts it inside run and no
      # hook provides a top-level one, so the bare path matched nothing and
      # every human handback below was dead.
      #
      # run.outputs.* is the same correction for the same reason, and it was
      # dead the same way: outputs live at run.outputs, so `outputs.spec.kind`
      # read nothing at all. One path to one fact, and it is the derived one —
      # a second, aliased spelling is how a predicate silently stops matching.
      - name: human answered the questions
        when:
          "run.stage": spec-questions
          "run.lastEvent.actor": human
          "run.counters.spec": { $lt: 3 }
      - name: reviewer's reply read as a change request
        when:
          "run.stage": triage
          "run.lastOutputValid": null
          "run.outputs.triage.intent": revise
          "run.counters.spec": { $lt: 3 }
      # A halt goes back to the stage that failed. Anything but a failed
      # build comes here — a failed spec, triage or review, and a review
      # budget spent with no stage failed at all — and a failed build goes
      # back to build, below. `$nin` and `$in` on the one list are exact
      # complements, so exactly one of the two can take any reply.
      #
      # Until the build's own three rounds are spent: then a failed build
      # comes here too. A build refused three times over the same spec text
      # otherwise had no route at all, and the spec that tripped the screener
      # could never be revised. `$lt` and `$gte` on the one counter are exact
      # complements too.
      - name: a halt was handed back
        when:
          "run.stage": blocked
          "run.lastEvent.actor": human
          "run.failedStages": { $nin: [build] }
          "run.counters.spec": { $lt: 3 }
      - name: a security refusal was handed back
        when:
          "run.stage": screened
          "run.lastEvent.actor": human
          "run.failedStages": { $nin: [build] }
          "run.counters.spec": { $lt: 3 }
      - name: a build out of rounds was handed back
        when:
          "run.stage": blocked
          "run.lastEvent.actor": human
          "run.failedStages": { $in: [build] }
          "run.counters.build": { $gte: 3 }
          "run.counters.spec": { $lt: 3 }
      - name: a build refused out of rounds was handed back
        when:
          "run.stage": screened
          "run.lastEvent.actor": human
          "run.failedStages": { $in: [build] }
          "run.counters.build": { $gte: 3 }
          "run.counters.spec": { $lt: 3 }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Writing the spec, round {round}." }
      - { type: tracker.status, value: spec }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  # Where the conversation rests while it is the human's turn. §10 routes
  # `triage --question--> spec-questions`, and `unclear` here too: the enum
  # exists so the model can abstain instead of guessing, and an abstention has
  # to land somewhere a human turn can reach or it is worse than a guess — the
  # ticket sat at `triage` wearing `lr:awaiting` and the next reply did
  # nothing, because decide() never evaluates the current stage's own
  # triggers. The triage step's own comment — its reason, in its own words —
  # is already on the ticket by the time this is entered, so "waits and asks"
  # is the asking; this is the waiting.
  - id: spec-questions
    triggers:
      - name: the agent has blocking questions
        when: { "run.stage": spec, "run.lastOutputValid": null, "run.outputs.spec.kind": questions }
      - name: the reviewer's reply was a question
        when: { "run.stage": triage, "run.lastOutputValid": null, "run.outputs.triage.intent": question }
      - name: the reviewer's reply could not be read either way
        when: { "run.stage": triage, "run.lastOutputValid": null, "run.outputs.triage.intent": unclear }
    on_enter:
      - { type: tracker.status, value: spec-questions }
      - { type: tracker.label, add: ["lr:awaiting"], remove: ["lr:working"] }

  - id: spec-human-review
    requires: { "run.outputs.spec.kind": spec }
    triggers:
      - name: the spec was published
        when: { "run.stage": spec, "run.lastOutputValid": null, "run.outputs.spec.kind": spec }
    on_enter:
      - { type: tracker.status, value: spec-human-review }
      - { type: tracker.label, add: ["lr:awaiting"], remove: ["lr:working"] }

  - id: triage
    step: steps/triage.md
    requires: { "run.lastHuman": { $ne: null } }
    triggers:
      - name: you replied
        when: { "run.stage": spec-human-review, "run.lastEvent.actor": human }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Reading your reply, round {round}." }
      - { type: tracker.status, value: triage }

  # ── build phase ──────────────────────────────────────────────────────────
  #
  # One branch per ticket, and it is this file that says so: a stage's
  # `branch` is where its step's worktree is checked out — the branch itself
  # for a step that may write, a detached look at its commit for one that may
  # not — and what a step commits there is what outlives the worktree. The
  # engine names no branch of its own; a workflow wanting two per ticket names
  # two.
  - id: build
    step: steps/build.md
    branch: "landrace/{ticket}"
    triggers:
      - name: the spec was approved
        when: { "run.stage": triage, "run.lastOutputValid": null, "run.outputs.triage.intent": approve }
      # A build that failed is handed back to build, not to spec: the spec was
      # approved and did nothing wrong. Three attempts, a refused or broken
      # one counting like any other.
      - name: a failed build was handed back
        when:
          "run.stage": blocked
          "run.lastEvent.actor": human
          "run.failedStages": { $in: [build] }
          "run.counters.build": { $lt: 3 }
      - name: a refused build was handed back
        when:
          "run.stage": screened
          "run.lastEvent.actor": human
          "run.failedStages": { $in: [build] }
          "run.counters.build": { $lt: 3 }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Implementing the spec, round {round}." }
      - { type: tracker.status, value: build }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  # Publishing is the orchestrator's, not an agent's, so there is no step. The
  # push and the pull request come before the status that moves the position:
  # a crash between them leaves the ticket at build, whose trigger fires again
  # and replans both — each dropped as satisfied if it had already landed.
  - id: publish
    triggers:
      - name: the build is done
        when: { "run.stage": build, "run.lastOutputValid": null, "run.outputs.build.kind": done }
    on_enter:
      - { type: branch.push, branch: "landrace/{ticket}" }
      - { type: pull.open, branch: "landrace/{ticket}" }
      - { type: tracker.status, value: publish }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting"] }

  - id: code-review
    step: steps/code-review.md
    branch: "landrace/{ticket}"
    requires: { "rel.implements.in.total": { $gt: 0 } }
    triggers:
      - name: the pull request is open
        when: { "run.stage": publish, "rel.implements.in.total": { $gt: 0 } }
      - name: the fixer finished a round
        when:
          "run.stage": fix-review
          "run.lastOutputValid": null
          "run.counters.code-review": { $lt: 4 }
    on_enter:
      # Pushed first: a fix round's commits have to be on the pull request
      # before the reviewer reads it. On the first entry it is already
      # satisfied — publish pushed the same head — and reconciles away.
      - { type: branch.push, branch: "landrace/{ticket}" }
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Reviewing the pull request, round {round}." }
      - { type: tracker.status, value: code-review }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting"] }

  - id: fix-review
    step: steps/fix-review.md
    branch: "landrace/{ticket}"
    triggers:
      - name: the reviewer left open threads
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": { $gt: 0 }
          "run.counters.code-review": { $lt: 4 }
      - name: you reopened a thread
        when:
          "run.stage": pr-human-review
          "rel.implements.in.sum.openThreads": { $gt: 0 }
          "run.counters.code-review": { $lt: 4 }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Addressing the open threads, round {round}." }
      - { type: tracker.status, value: fix-review }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting"] }

  - id: pr-human-review
    triggers:
      - name: no threads are open
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.sum.openThreads": 0
    on_enter:
      - { type: tracker.status, value: pr-human-review }
      - { type: tracker.label, add: ["lr:awaiting"], remove: ["lr:working"] }

  # ── terminal ─────────────────────────────────────────────────────────────
  - id: done
    terminal: true
    triggers:
      - name: merged
        when:
          "run.stage": pr-human-review
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.not.merged": 0
    on_enter:
      - { type: tracker.status, value: done }
      - { type: tracker.label, remove: ["lr:auto", "lr:awaiting", "lr:working"] }

  - id: blocked
    triggers:
      # The open-thread count is part of the condition, not decoration: the
      # last review round can finish with nothing left open, and then
      # pr-human-review's trigger fires too. Two triggers matching is a halt,
      # so "the budget is spent" has to mean "spent with findings still open".
      - name: the review budget is exhausted
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": { $gt: 0 }
          "run.counters.code-review": { $gte: 4 }
      # `run.lastRefused` is false for a broken contract and true for a
      # refusal, never null while `lastOutputValid` is false — so this and
      # `screened` below split every failure between them, one each.
      - name: a step broke its output contract
        when: { "run.lastOutputValid": false, "run.lastRefused": false }
    on_enter:
      - { type: tracker.status, value: blocked }
      - { type: tracker.label, add: ["lr:blocked"], remove: ["lr:working", "lr:awaiting"] }

  # A step a security check stopped: screened out before it ran, or caught
  # afterwards doing what its step never declared. Still a halt, and still
  # `lr:blocked` — everything that asks whether a ticket is stopped must keep
  # hearing yes — with `lr:screened` beside it to say it was not the agent's
  # answer that failed but the prompt, or what the agent did.
  - id: screened
    triggers:
      - name: a security check refused a step
        when: { "run.lastOutputValid": false, "run.lastRefused": true }
    on_enter:
      - { type: tracker.status, value: screened }
      - { type: tracker.label, add: ["lr:blocked", "lr:screened"], remove: ["lr:working", "lr:awaiting"] }
