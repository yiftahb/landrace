version: 1
name: Fastlane
description: "Small changes from the item's own text: build, review, CI, merged automatically. A person only when it is stuck."

# An item labelled lr:fast is built from its own text — there is no spec —
# reviewed, put through CI, and merged by Landrace once its checks are green,
# guarded by the head the checks ran on; then the item is closed. A person is
# needed only at a halt, or when a cap leaves the item `stuck`.
#
# Rulings this file keeps:
#
# - A moved head goes back to code review, not straight to CI. A merge that
#   answered moved is never applied again while the item stays at `merge`, and
#   the new head may read no checks yet, so a way out that waited on pending or
#   failed checks would hang. merge's counter advances only when the forge
#   refuses its way in, never on a moved head, so a merge ⇄ ci loop could only
#   be bounded by a counter it never moves; and a head that moved is code
#   nobody reviewed.
# - The retro goes back to code review: its commits land in the pull request
#   before the merge, so they are reviewed and checked like any other.
# - Friction — what sends a green pull request to the retro first — is a
#   second build (a CI fix or a rework), any fix round, or any reply a person
#   had to write. The retro runs at most once.
# - Caps: build 3, CI fixes included; code review 4; fix review 8. At a cap
#   the item is `stuck`, and waits on a person.
# - The merge needs every thread resolved. A review that leaves threads open
#   with none awaiting a fix is `stuck` too, since a thread the fixer answered
#   waits on a person, never on a step; and a thread opened while the checks
#   ran goes back to review first, like any other finding.
# - `done` closes the item itself, so it closes where the forge links nothing.
# - A merge the forge refuses — conflicts, branch protection, checks gone red
#   since the read — is merge's rejected round: the item halts at `blocked`,
#   on the board, with the forge's sentence, and a person's Retry merges again.
#   So is a pull request the forge will not open or close.
admit: [lr:fast]

# The same three integrations full-cycle loads, by the same paths: one project.
hooks:
  - ../../hooks/github.ts
  - ../../hooks/claude.ts
  - ../../hooks/slack.ts

# Never lr:auto: an item both workflows accepted would be claimed twice and halt.
eligible:
  - when: { "node.state.labels": { $in: ["lr:fast"] } }
    else: "no lr:fast label"

# The default for triage, the one step that names no timeout of its own.
budget:
  stepTimeout: 10m

# full-cycle's conventions hold here, and for the same reasons (its header says
# why): `tracker.status` names the stage's own id; an `enter` record comes
# first, before the status that moves the position; every trigger leaving a
# stage that runs a step reads `"run.lastOutputValid": null`, so a failed round
# is only the halts' to route; and wherever it is a person's turn a reply goes
# to `triage`, which reads it into one closed set of answers.
#
# And full-cycle's rule for the ways the forge can refuse: every trigger leaving a
# stage with no step reads `"run.lastOutputValid": null` too, unless it waits
# on a person's own message. A refused merge, pull request or close is the
# rejected round of the stage being entered, read where the item still
# stands, and only a halt may take it from there. Each stage with no step
# that opens, merges or closes a pull request writes its `enter` record
# first, and the halts list it for Retry.
#
# One more, about exits: two triggers leaving one stage are written as each
# other's negation, never left to overlap. Two matching is an ambiguity halt,
# and none matching is an item that waits with nothing to say why.
# tests/workflow/fastlane.test.ts puts every stage's boundary values to them.
stages:
  # ── build ────────────────────────────────────────────────────────────────
  #
  # The item's own text is the whole brief. Reached fresh, from a red pull
  # request while builds are left — a CI fix is a build round, within build's
  # three — and from a person's reply asking for work, uncapped: each one
  # waits for someone to write.
  - id: build
    step: steps/build.md
    entry: true
    branch: "landrace/{item}"
    goto: [{ stage: build, when: { "run.counters.build": { $lt: 3 } } }]
    triggers:
      - name: a fresh item
        when: { "run.stage": null }
      - name: the checks failed
        when:
          "run.stage": ci
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": 0
          "rel.implements.in.sum.ciFailed": { $gt: 0 }
          "run.counters.build": { $lt: 3 }
      - name: you asked for work
        when:
          "run.stage": triage
          "run.lastOutputValid": null
          "run.outputs.triage.intent": rework
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Building the item, round {round}." }
      - { type: tracker.status, value: build }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  # As full-cycle's: the push and the pull request land before the position moves,
  # so a crash between them leaves the item at build to replan both, and the
  # `enter` record before them, so a refusal of either is publish's rejected
  # round. A later build round finds its pull request open, and only pushes.
  - id: publish
    triggers:
      - name: the build is done
        when: { "run.stage": build, "run.lastOutputValid": null, "run.outputs.build.kind": done }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Publishing, round {round}." }
      - { type: branch.push, branch: "landrace/{item}" }
      - { type: pull.open, branch: "landrace/{item}" }
      - { type: tracker.status, value: publish }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  # ── review ───────────────────────────────────────────────────────────────
  #
  # full-cycle's reviewer and fixer, shown the item's own text where full-cycle's are
  # shown the spec, and otherwise as they are. Every build is reviewed
  # through publish, uncapped; every fix within fix review's eight; the
  # retro's commit once; and a head that moved under the merge, or a thread
  # opened while the checks ran, within code review's own four — loops through
  # stages with no step, whose counters count only a refused way in.
  #
  # No `requires` here or on the retro: a pull request a person closed while
  # either ran is their stop, routed to `stuck`, where a failed precondition
  # would halt the item on every tick where no board shows it.
  - id: code-review
    step: steps/code-review.md
    branch: "landrace/{item}"
    triggers:
      - name: the pull request is open
        when: { "run.stage": publish, "run.lastOutputValid": null, "rel.implements.in.total": { $gt: 0 } }
      - name: the fixer finished a round
        when:
          "run.stage": fix-review
          "run.lastOutputValid": null
          "rel.implements.in.total": { $gt: 0 }
          "run.counters.fix-review": { $lt: 8 }
      - name: the retro is done
        when: { "run.stage": retro, "run.lastOutputValid": null, "rel.implements.in.total": { $gt: 0 } }
      - name: the head moved before the merge
        when:
          "run.stage": merge
          "run.lastOutputValid": null
          "rel.implements.in.not.merged": { $gt: 0 }
          "run.counters.code-review": { $lt: 4 }
      # A person's objection, in a flow with no person: before anything else
      # at ci, whatever the checks say. A finding like any other, it goes to
      # the fixer, and the person resolves their own thread.
      - name: a thread was opened while the checks ran
        when:
          "run.stage": ci
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": { $gt: 0 }
          "run.counters.code-review": { $lt: 4 }
    on_enter:
      # Pushed first: a fix round's or the retro's commits are on the pull
      # request before the reviewer reads it.
      - { type: branch.push, branch: "landrace/{item}" }
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Reviewing the pull request, round {round}." }
      - { type: tracker.status, value: code-review }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  - id: fix-review
    step: steps/fix-review.md
    branch: "landrace/{item}"
    triggers:
      - name: the reviewer left threads awaiting a fix
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.sum.awaitingFix": { $gt: 0 }
          "run.counters.code-review": { $lt: 4 }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Addressing the open threads, round {round}." }
      - { type: tracker.status, value: fix-review }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  # ── CI and the merge ─────────────────────────────────────────────────────
  #
  # A review that settled with every thread resolved waits here for the
  # checks on the pull request's head. A thread opened meanwhile goes back to
  # review first; then red goes back to build while builds are left, and
  # green to the retro after friction, or to the merge. Checks still running
  # match nothing, and the item waits. A pull request a person closed is
  # stuck's, not a precondition's: a failed `requires` halts where no board
  # shows it. Nothing is pushed here — the review's own push published the
  # head it read, and a push now could publish one nobody reviewed.
  - id: ci
    triggers:
      - name: the review settled with every thread resolved
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.not.merged": { $gt: 0 }
          "rel.implements.in.sum.awaitingFix": 0
          "rel.implements.in.sum.openThreads": 0
    on_enter:
      - { type: tracker.status, value: ci }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting"] }

  # Once, on the whole history, when the item was corrected on the way. Not
  # once the pull request merged — a person can merge it by hand — since
  # lessons committed then land on a branch nothing will merge again.
  - id: retro
    step: steps/retro.md
    branch: "landrace/{item}"
    triggers:
      - name: the checks passed after corrections
        when:
          "run.stage": ci
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": 0
          "rel.implements.in.sum.ciPending": 0
          "rel.implements.in.sum.ciFailed": 0
          "rel.implements.in.not.merged": { $gt: 0 }
          "run.counters.retro": { $lt: 1 }
          $or:
            - { "run.counters.build": { $gt: 1 } }
            - { "run.counters.fix-review": { $gt: 0 } }
            - { "run.counters.triage": { $gt: 0 } }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Learning from this item's corrections, round {round}." }
      - { type: tracker.status, value: retro }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  # The retro's trigger, negated: the two never match together. The merge
  # comes after the `enter` record and before the status, as publish's push
  # does. A refusal — conflicts, not mergeable, checks gone red since the
  # read — is merge's rejected round, read at ci where the item still is: it
  # goes to `blocked`, on the board with the forge's sentence, and nothing
  # asks the forge again until a person's Retry does. A merge that failed on
  # the way, an outage, leaves the item at ci and is tried on the next tick.
  # A merge that answered moved lands here with the pull request open, and
  # goes back to review.
  - id: merge
    triggers:
      - name: the checks passed
        when:
          "run.stage": ci
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": 0
          "rel.implements.in.sum.ciPending": 0
          "rel.implements.in.sum.ciFailed": 0
          $or:
            - $and:
                - { "run.counters.build": { $lt: 2 } }
                - { "run.counters.fix-review": { $lt: 1 } }
                - { "run.counters.triage": { $lt: 1 } }
            - { "run.counters.retro": { $gte: 1 } }
            - { "rel.implements.in.not.merged": 0 }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Merging the pull request, round {round}." }
      # Only the head code review read: the runner records the commit each
      # review round started at, and a head that round did not start at —
      # pushed after the review, while CI ran — answers as a moved head does,
      # and goes back to review. A fix's or the retro's commits are reviewed
      # the same way, since each goes through a review round of its own.
      #
      # And the paths only a person merges, whatever the review said: the
      # engine's own hooks, imported with this project's secrets, its
      # configuration and workflows, CI, the dependencies an install runs, and
      # the agents' own instructions. The kit reads the pull request's changed
      # files — a rename's old name too — and refuses one touching any of
      # them, or one whose list it could not read to the end: `blocked`, for a
      # person.
      - type: pull.merge
        branch: "landrace/{item}"
        reviewedBy: code-review
        refuse:
          - .landrace/hooks/**
          - .landrace/landrace.yaml
          - .landrace/workflows/*/workflow.yaml
          - .github/**
          - package.json
          - pnpm-lock.yaml
          - .agsync/**
          - .mcp.json
          - CLAUDE.md
          - AGENTS.md
      - { type: tracker.status, value: merge }
      - { type: tracker.label, add: ["lr:working"], remove: ["lr:awaiting", "lr:blocked", "lr:screened"] }

  # ── terminal ─────────────────────────────────────────────────────────────
  - id: done
    terminal: true
    triggers:
      - name: merged
        when:
          "run.stage": merge
          "run.lastOutputValid": null
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.not.merged": 0
      # The way on to CI, negated: a review that found the pull request
      # merged — by a person, by hand — has nothing left to check or merge.
      - name: the pull request was merged by hand
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.not.merged": 0
          "rel.implements.in.sum.awaitingFix": 0
          "rel.implements.in.sum.openThreads": 0
      # The natural answer to stuck: a person merges it. Triage's trigger at
      # stuck is this one's negation.
      - name: the pull request was merged while it was stuck
        when:
          "run.stage": stuck
          "run.lastOutputValid": null
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.not.merged": 0
      # And to a merge the kit refused: a protected path is a person's to
      # merge, and once they have, nothing is left. Triage's trigger at
      # blocked is this one's negation. No `run.lastOutputValid: null`: at the
      # halt a refusal is already taken, and after a Retry the forge refused
      # again it reads false here, which would hold a merged item for good.
      - name: the pull request was merged while it was blocked
        when:
          "run.stage": blocked
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.not.merged": 0
    # The close first, as merge merges first: an outage on it leaves the item
    # where it was, still lr:fast, and the next tick closes it. After the
    # labels, it left an item done, no longer admitted, and open for good.
    on_enter:
      - { type: tracker.close }
      - { type: tracker.status, value: done }
      - { type: tracker.label, remove: ["lr:fast", "lr:awaiting", "lr:working", "lr:blocked", "lr:screened"] }

  # A person asked to drop it: its pull request is closed unmerged, then the
  # item, as dropped. Both before the position moves, as merge merges first,
  # and after the `enter` record: a close the forge refuses is this stage's
  # rejected round, read at triage, and goes to `blocked` for a person's
  # Retry; one that failed on the way leaves the item at triage for the next
  # tick. A terminal stage would plan nothing again. Not nodes.close, which
  # drops only what this item's own steps created.
  - id: closed
    terminal: true
    triggers:
      - name: you asked to close it
        when:
          "run.stage": triage
          "run.lastOutputValid": null
          "run.outputs.triage.intent": close
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Closing the pull request and the item, round {round}." }
      - { type: pull.close, branch: "landrace/{item}" }
      - { type: tracker.close, how: dropped }
      - { type: tracker.status, value: closed }
      - { type: tracker.label, remove: ["lr:fast", "lr:awaiting", "lr:working", "lr:blocked", "lr:screened"] }

  # ── a person's turn ──────────────────────────────────────────────────────
  #
  # Where a cap leaves the item. Each trigger is the exact negation of the way
  # on it caps. A person may send it back to build or to review, within those
  # caps, or reply: work, a close, or a question answered here.
  - id: stuck
    waits: person
    goto:
      - { stage: build, when: { "run.counters.build": { $lt: 3 } } }
      - stage: code-review
        when: { "run.counters.code-review": { $lt: 4 }, "rel.implements.in.total": { $gt: 0 } }
    triggers:
      # The awaiting-fix count is the condition, as in full-cycle's: a last review
      # that left nothing awaiting a fix goes on to CI instead.
      - name: the review budget is exhausted
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.sum.awaitingFix": { $gt: 0 }
          "run.counters.code-review": { $gte: 4 }
      - name: threads are open that no fix awaits
        when:
          "run.stage": code-review
          "run.lastOutputValid": null
          "rel.implements.in.sum.awaitingFix": 0
          "rel.implements.in.sum.openThreads": { $gt: 0 }
      - name: the fix budget is exhausted
        when:
          "run.stage": fix-review
          "run.lastOutputValid": null
          "rel.implements.in.total": { $gt: 0 }
          "run.counters.fix-review": { $gte: 8 }
      - name: CI is still failing after three builds
        when:
          "run.stage": ci
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": 0
          "rel.implements.in.sum.ciFailed": { $gt: 0 }
          "run.counters.build": { $gte: 3 }
      - name: a thread was opened after the last review
        when:
          "run.stage": ci
          "run.lastOutputValid": null
          "rel.implements.in.sum.openThreads": { $gt: 0 }
          "run.counters.code-review": { $gte: 4 }
      # A person closed it unmerged — their way of saying stop — during a
      # review, a fix, the retro, CI or the merge. With no pull request the
      # item has nothing to check or merge, and is theirs. During a build,
      # publish refuses to open another over their close, and the item halts.
      - name: the pull request was closed during the review
        when: { "run.stage": code-review, "run.lastOutputValid": null, "rel.implements.in.total": 0 }
      - name: the pull request was closed during a fix
        when: { "run.stage": fix-review, "run.lastOutputValid": null, "rel.implements.in.total": 0 }
      - name: the pull request was closed during the retro
        when: { "run.stage": retro, "run.lastOutputValid": null, "rel.implements.in.total": 0 }
      - name: the pull request was closed during CI
        when: { "run.stage": ci, "run.lastOutputValid": null, "rel.implements.in.total": 0 }
      - name: the pull request was closed before the merge
        when: { "run.stage": merge, "run.lastOutputValid": null, "rel.implements.in.total": 0 }
      - name: the head kept moving
        when:
          "run.stage": merge
          "run.lastOutputValid": null
          "rel.implements.in.not.merged": { $gt: 0 }
          "run.counters.code-review": { $gte: 4 }
      - name: your reply changed nothing here
        when:
          "run.stage": triage
          "run.lastOutputValid": null
          "run.previousStage": stuck
          "run.outputs.triage.intent": { $in: [question, unclear] }
    on_enter:
      - { type: tracker.status, value: stuck }
      - { type: tracker.label, add: ["lr:awaiting"], remove: ["lr:working"] }

  # The judge, for every reply where it is a person's turn. No round cap:
  # every trigger here waits for a person's own message. `rework` goes to
  # build and `close` to closed from wherever the reply was made; a question
  # or an unclear reply comes home.
  - id: triage
    step: steps/triage.md
    requires: { "run.lastHuman": { $ne: null } }
    triggers:
      # Not once its pull request merged: done takes that, whoever wrote last.
      - name: you replied where it was stuck
        when:
          "run.stage": stuck
          "run.lastEvent.actor": human
          $or:
            - { "rel.implements.in.not.merged": { $gt: 0 } }
            - { "rel.implements.in.total": 0 }
      # Not once its pull request merged: done takes that, as at stuck.
      - name: you replied to a halt
        when:
          "run.stage": blocked
          "run.lastEvent.actor": human
          $or:
            - { "rel.implements.in.not.merged": { $gt: 0 } }
            - { "rel.implements.in.total": 0 }
      - name: you replied to a security refusal
        when: { "run.stage": screened, "run.lastEvent.actor": human }
    on_enter:
      - { type: tracker.comment, kind: enter, marker: "enter:{stage}:{round}", body: "Reading your reply, round {round}." }
      - { type: tracker.status, value: triage }

  # ── halts ────────────────────────────────────────────────────────────────
  #
  # As full-cycle's: Retry is a goto to the step whose failure put the item here,
  # so the halts list every step, each within its own rounds and only where
  # it can run. Code review is held to eight, past its loop's four: each
  # build adds a review through publish, uncapped, and a moved head another.
  # The retro is held to two — its one round, and one Retry of it. And the
  # three stages with no step whose way in the forge can refuse — publish,
  # merge and closed — three times each, their rounds being only the refused
  # ones, and only as what failed: Retry's alone. "Go to step… merge" after
  # any other failure would merge code a review never passed.
  - id: blocked
    goto: &halt
      - { stage: build, when: { "run.counters.build": { $lt: 3 } } }
      - { stage: publish, when: { "run.failedStage": publish, "run.counters.publish": { $lt: 3 } } }
      - stage: code-review
        when: { "run.counters.code-review": { $lt: 8 }, "rel.implements.in.total": { $gt: 0 } }
      - stage: fix-review
        when: { "run.counters.fix-review": { $lt: 8 }, "rel.implements.in.total": { $gt: 0 } }
      - stage: retro
        when:
          "run.counters.retro": { $lt: 2 }
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.not.merged": { $gt: 0 }
      # The merge needs every thread resolved, a Retry's as much as the
      # first, and the head the last review read: a head pushed while the
      # item was halted answers as moved, and goes back to code review.
      - stage: merge
        when:
          "run.failedStage": merge
          "run.counters.merge": { $lt: 3 }
          "rel.implements.in.total": { $gt: 0 }
          "rel.implements.in.sum.openThreads": 0
          "rel.implements.in.sum.awaitingFix": 0
      - { stage: closed, when: { "run.failedStage": closed, "run.counters.closed": { $lt: 3 } } }
      - stage: triage
        when: { "run.counters.triage": { $lt: 20 }, "run.lastHuman": { $ne: null } }
    triggers:
      # `run.lastRefused` splits every failure between this and `screened`.
      - name: a step broke its output contract
        when: { "run.lastOutputValid": false, "run.lastRefused": false }
      - name: your reply changed nothing here
        when:
          "run.stage": triage
          "run.lastOutputValid": null
          "run.previousStage": blocked
          "run.outputs.triage.intent": { $in: [question, unclear] }
    on_enter:
      - { type: tracker.status, value: blocked }
      # lr:screened off too: a Retry from `screened` the forge refused comes
      # here, a broken way on and no security stop, before the target it was
      # sent to took the label off.
      - { type: tracker.label, add: ["lr:blocked"], remove: ["lr:working", "lr:awaiting", "lr:screened"] }

  - id: screened
    goto: *halt
    triggers:
      - name: a security check refused a step
        when: { "run.lastOutputValid": false, "run.lastRefused": true }
      - name: your reply changed nothing here
        when:
          "run.stage": triage
          "run.lastOutputValid": null
          "run.previousStage": screened
          "run.outputs.triage.intent": { $in: [question, unclear] }
    on_enter:
      - { type: tracker.status, value: screened }
      - { type: tracker.label, add: ["lr:blocked", "lr:screened"], remove: ["lr:working", "lr:awaiting"] }
