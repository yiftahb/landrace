version: 1

agent:
  adapter: claude
  model: opus
  # Every step and turn; a step's own `effort:` wins. Never the screener.
  effort: high
  isolation: worktree
  # A read-only step runs --restricted, which ignores ~/.claude/settings.json
  # and every plugin enabled there, and its worktree has no .mcp.json — so the
  # skills and the codebase graph the step prompts ask for are named here.
  # Servers are names looked up in the repository root's .mcp.json (`agsync
  # sync` writes it); the landrace operator server is refused, never allowed.
  plugins: [superpowers@claude-plugins-official]
  # The graph's reading tools, and index_repository because a fresh worktree
  # is not indexed yet — never the whole server, which could also delete a
  # project, rewrite its ADRs or ingest traces.
  mcp:
    - name: codebase-memory-mcp
      tools:
        - search_graph
        - trace_path
        - get_code_snippet
        - query_graph
        - get_architecture
        - search_code
        - get_graph_schema
        - index_status
        - list_projects
        - index_repository
  # A write step (build, fix-review) runs Bash inside Claude Code's sandbox:
  # it writes only in its worktree and the repository's .git, and reaches only
  # these hosts — github.com to fetch and push, the npm registry to install —
  # and never reads under these paths, where credentials live. A deny list
  # here replaces the hook's defaults, so it names all four.
  sandbox:
    hosts: [github.com, registry.npmjs.org]
    deny: [~/.config/gh, ~/.ssh, ~/.aws, ~/.npmrc]

# Opaque to the engine, handed to the hooks as it stands. `repo` is here
# because hooks/github.ts reads it, not because landrace knows what a repo is.
tracker:
  repo: yiftahb/landrace

tick:
  interval: 2m
  concurrency: 3

security:
  screen: true
  model: haiku

# A ticket that comes to rest waiting on a person is posted to Slack, once
# per arrival, by hooks/slack.ts. The board's 🔔 does the same in a browser.
notify:
  on: [needs-you]
  via: [slack]

# The webhook is the credential; the member id is only who to mention.
log:
  redact: [githubToken, slackWebhookUrl]

secrets:
  githubToken: $GITHUB_TOKEN
  slackWebhookUrl: $SLACK_WEBHOOK_URL
  slackNotifyUser: $SLACK_NOTIFY_USER
