version: 1

agent:
  adapter: claude
  model: opus
  isolation: worktree
  # A read-only step runs --restricted, which ignores ~/.claude/settings.json
  # and every plugin enabled there, and its worktree has no .mcp.json — so the
  # skills and the codebase graph the step prompts ask for are named here.
  # Servers are names looked up in the repository root's .mcp.json (`agsync
  # sync` writes it); the landrace operator server is refused, never allowed.
  plugins: [superpowers@claude-plugins-official]
  mcp: [codebase-memory-mcp]

# Opaque to the engine, handed to the hooks as it stands. `repo` is here
# because hooks/github.ts reads it, not because landrace knows what a repo is.
tracker:
  repo: yiftahb/landrace

tick:
  interval: 60s
  concurrency: 3

security:
  screen: true
  model: haiku

log:
  redact: [githubToken]

secrets:
  githubToken: $GITHUB_TOKEN
